<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>נסו להפיל את קופסת ההפתעות בקרון הנכון - המשפחה של סול</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0F1D1B; overflow: hidden; }

  /* Wordwall keeps its timer, score, menu and sound controls in all four
     corners of the game, so the home button cannot float over it without
     hiding one of them. It gets its own strip above the game instead. */
  :root { --sol-bar: 60px; }
  @media (max-width: 640px) { :root { --sol-bar: 52px; } }

  /* The game fills the screen; only the home button sits above it. */
  #game-frame {
    position: absolute; top: var(--sol-bar); left: 0; right: 0; bottom: 0;
    width: 100%; height: calc(100% - var(--sol-bar));
    border: 0; display: block;
  }

  /* ---------- Sol home button (unified turquoise) ---------- */
  .sol-home-btn {
    position: fixed;
    top: 4px;
    left: 12px;
    z-index: 101;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #17A79B;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(18, 48, 44, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .sol-home-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 18px rgba(18, 48, 44, 0.45); }
  .sol-home-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
  .sol-home-btn svg { width: 26px; height: 26px; }
  @media (max-width: 640px) {
    .sol-home-btn { width: 44px; height: 44px; top: 4px; left: 8px; }
    .sol-home-btn svg { width: 22px; height: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sol-home-btn { transition: none; }
    .sol-home-btn:hover { transform: none; }
  }

/* ---------- Sol lesson navigation (next / previous) ---------- */
/* Smaller than the home button: it keeps the exact corner, size and colour
   it holds on every page of the platform, and the arrows read as secondary
   to it.

   This page is a Wordwall wrapper: a thin strip holding the home button with
   the game in an iframe directly below it. Unlike the lessons there is no
   free margin under the home button — the game starts 4px below — so here
   the arrows sit BESIDE it, inside the strip, which is empty across its
   width. Measured: the game starts at y52 on a phone and y60 above that.

   (On the lesson pages the opposite is true and the row goes below.)

   Ignore the paragraph that follows about being below
   the first choice and it looked right in isolation, but measured against
   the real pages it covered a control on 6 of 11 lessons, because most
   lessons put their own control row at exactly that height. The left margin
   under the home button is empty on every lesson.

   They sit in a row rather than at fixed
   coordinates each, so a lesson that has only one of them keeps it snug
   against the home button instead of leaving a hole where the other would
   have been. The row is forced to LTR so the arrows keep their order on a
   right-to-left page. */
.sol-nav {
    position: fixed;
    top: 11px;
    left: 74px;
    height: 38px;
    z-index: 101;
    display: flex;
    align-items: center;
    gap: 8px;
    direction: ltr;
}
.sol-nav-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #17A79B;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(18, 48, 44, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.sol-nav-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 18px rgba(18, 48, 44, 0.45); }
.sol-nav-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
.sol-nav-btn svg { width: 20px; height: 20px; }
@media (max-width: 640px) {
    .sol-nav { top: 9px; left: 60px; height: 34px; gap: 6px; }
    .sol-nav-btn { width: 34px; height: 34px; }
    .sol-nav-btn svg { width: 18px; height: 18px; }
}
@media (prefers-reduced-motion: reduce) {
    .sol-nav-btn { transition: none; }
    .sol-nav-btn:hover { transform: none; }
}
</style>
</head>
<body>

<iframe id="game-frame"
        src="https://wordwall.net/he/embed/8dc46052084c4723b7ee7cf4af829daf?themeId=22&amp;templateId=71&amp;fontStackId=0"
        title="נסו להפיל את קופסת ההפתעות בקרון הנכון"
        allowfullscreen
        allow="autoplay; fullscreen"></iframe>

<a class="sol-home-btn" href="https://portal.smoove.io/gsbmtbnbbf1yd87kbofd1/Category?category=qqb" target="_top" aria-label="חזרה למסך הבית">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 11l9-8 9 8" />
    <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
  </svg>
</a>
<div class="sol-nav">
  <a class="sol-nav-btn sol-nav-next" href="https://hanibarsol.github.io/sol-game-drag-note-name/" target="_top" aria-label="להמשך">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" />
    </svg>
  </a>
  <a class="sol-nav-btn sol-nav-back" href="https://hanibarsol.github.io/sol-game-memory-five/" target="_top" aria-label="אחורה">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 5l7 7-7 7" />
    </svg>
  </a>
</div>


<script>
/* sol-home-back: the home button. It asks nothing and guesses nothing.

   Try to close the tab. If the tab is still here a moment later, go to the portal.

   Everything more clever than that has failed here, and each failure taught the same lesson: this
   page cannot tell how the child arrived. Smoove routes every click through click.smoove.io, which
   strips the referrer completely, and the tracker leaves an entry in the history as well - so
   "where did you come from" and "is this a fresh tab" both answer wrongly. A version that counted
   history entries sent Hani's own phone back into a games site her children had used; a version
   that checked history.length sent her tester one lesson back and then to a login screen. Measured
   on her devices, 28.8.2026.

   Closing works because Smoove opens the lesson in a new tab and that tab is ours to close - it
   returns the child to the Smoove page they left, still signed in, however many lessons they moved
   through with the arrows first.

   The fallback is the short courses link from the course settings: the one Smoove address measured
   to work for somebody who is not Hani - her tester opened it signed in, without a password. It
   lands a step further out than the lesson's own page, and that is the price of never landing
   somewhere else entirely. */
(function () {
  var PORTAL = "https://portal.smoove.io/dfb7";
  var home = document.querySelector('a[href*="portal.smoove.io"][href*="Category"]')
          || document.querySelector('a[href*="portal.smoove.io"]');
  if (!home) return;

  home.addEventListener("click", function (e) {
    e.preventDefault();
    try { window.close(); } catch (err) {}
    window.setTimeout(function () {
      try { window.top.location.href = PORTAL; } catch (err) { location.href = PORTAL; }
    }, 350);
  });
})();
</script>

<style>
/* sol-crios: Chrome on iPhone hides the top of the page, so nothing the child
   needs is put there.

   Chrome sometimes paints the page from the top of the window instead of below
   its own address bar. Measured on a tester's phone: an 852 screen, a 669
   opening, Chrome handing the page a correct 666 and then drawing it from three
   pixels above the screen. The first hundred-odd pixels vanish behind the
   address bar and the leftover shows as black along the bottom.

   Nothing in the page can see it. Twelve values were compared between a phone
   where Chrome places the page correctly and one where it does not, including
   outerHeight, availHeight, visualViewport.offsetTop and the position of the
   document root: every one identical. Four attempts to make Chrome measure
   again - a compositing layer, a small-viewport height, a pixel of scroll, a
   rewritten viewport tag - all failed. Safari on the same phone, same link,
   same minute, is always perfect.

   So the page starts below the strip Chrome eats. The strip is the same dark
   colour as the page and carries nothing, at Hani's request: when Chrome
   behaves it reads as nothing at all, just a page sitting slightly lower; when
   Chrome misbehaves it is the strip that disappears instead of the content.

   Its height cannot be trimmed - it is exactly what Chrome hides, and anything
   shorter puts the top of the content back under the address bar. It is measured
   per device and bounded, so no phone can push the page into mid-screen.

   Chrome on iOS only. Safari, Android, iPad and desktop never run a line of it. */
/* The wrapper already holds the game below a strip of its own, so widening
   that strip moves the game, and nothing else has to change. */
html.sol-crios { --sol-bar: calc(52px + var(--sol-crios-drop, 110px)); }
html.sol-crios .sol-home-btn { top: calc(4px + var(--sol-crios-drop, 110px)); }
html.sol-crios .sol-nav      { top: calc(9px + var(--sol-crios-drop, 110px)); }
</style>
<script>
(function () {
  if (!/CriOS/.test(navigator.userAgent)) return;
  function place() {
    var bars = window.screen.height - window.innerHeight;  /* both Chrome bars */
    var top = bars - 80;                                   /* minus the bottom one */
    if (top < 90) top = 90;
    if (top > 140) top = 140;
    document.documentElement.style.setProperty("--sol-crios-drop", top + "px");
  }
  document.documentElement.classList.add("sol-crios");
  place();
  window.addEventListener("resize", place);
  window.addEventListener("orientationchange", function () { setTimeout(place, 300); });
})();
</script></body>
</html>
